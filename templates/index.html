<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a href="/" class="logo">Stock<span>View</span></a>

        <form id="stock-form" class="stock-form">
            <input
                type="text"
                id="ticker"
                placeholder="Enter ticker (e.g. NVDA)"
                value="NVDA"
                required
                autocomplete="off"
            >
            <button type="submit" id="load-button">Load Stock</button>
            <button type="button" id="download-button" class="secondary">
                Download
            </button>
        </form>
    </header>

    <main class="main">
        <div class="heading">
            <div>
                <p class="eyebrow">MARKET DATA</p>
                <h1 id="stock-title">Stock Preview</h1>
                <p class="subtitle" id="stock-subtitle">
                    Select a ticker to inspect its historical data.
                </p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span id="status-text">Ready</span>
            </div>
        </div>

        <section class="preview-card">
            <div class="preview-header">
                <div>
                    <h2 id="preview-title">Data Preview</h2>
                    <p id="preview-description">
                        Your stock data will appear here.
                    </p>
                </div>

                <span class="format-badge" id="format-badge">CSV</span>
            </div>

            <div id="preview" class="preview">
                <div class="empty-state">
                    <div class="empty-icon">↗</div>
                    <h3>No data loaded</h3>
                    <p>Enter a ticker above to preview stock data.</p>
                </div>
            </div>
        </section>

        <p class="note">
            Data is fetched from your configured stock API.
        </p>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div>
                <label for="data-type">Preview format</label>
                <p>Choose how to display the stock data.</p>
            </div>

            <select id="data-type">
                <option value="csv">CSV Table</option>
                <option value="line">Line Graph</option>
                <option value="jsonl">JSONL</option>
            </select>
        </div>
    </footer>
</body>
</html>
